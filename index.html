<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="รางเงิน">
<meta name="theme-color" content="#E7EBE4">
<title>รางเงิน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E7EBE4; --card:#F5F7F2; --card-2:#EEF1EA;
  --ink:#16241F; --ink-2:#4C5D56; --ink-3:#8B9A92;
  --line:#CBD4C9; --line-2:#DDE3D9;
  --stamp:#A6322B; --teal:#1D6B5F;
  --w1:#3E7A57; --w2:#3A6A96; --w3:#A6322B; --w4:#6E5794; --w5:#7A6A55;
  --r:14px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:'IBM Plex Sans Thai Looped','Sukhumvit Set','Thonburi',system-ui,sans-serif;
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button,input{font-family:inherit;font-size:16px;color:inherit}
button{border:none;background:none;cursor:pointer;padding:0}
#app{max-width:520px;margin:0 auto;padding:var(--safe-t) 16px calc(40px + var(--safe-b))}

.masthead{padding:14px 2px 12px;display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);margin-bottom:16px}
.masthead h1{margin:0;font-family:'Bai Jamjuree',sans-serif;font-weight:700;font-size:19px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.sec{margin-top:18px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;padding:0 2px}

/* inputs */
label.f{display:block}
label.f+label.f{margin-top:12px}
label.f span{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:6px}
input[type=number],input[type=date],input[type=text]{
  width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;background:var(--card-2);
  font-size:17px;appearance:none;font-family:'IBM Plex Mono',monospace;font-weight:500;
}
input[type=date]{font-family:inherit;font-size:16px}
input:focus{outline:2px solid var(--teal);outline-offset:-1px}
.two{display:flex;gap:10px}
.two>label{flex:1}

/* hero */
.hero{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px}
.hero .big{display:flex;align-items:baseline;gap:9px;margin-top:4px}
.hero .big b{font-family:'Bai Jamjuree',sans-serif;font-size:40px;font-weight:700;line-height:1;letter-spacing:-.015em}
.hero .big span{font-size:13px;color:var(--ink-2)}
.hero .sub{margin-top:9px;font-size:13px;color:var(--ink-2);line-height:1.5}
.hero.off b{color:var(--ink-3)}

/* runway */
.runway-wrap{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 12px;position:relative;overflow:hidden}
.runway-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.runway{position:relative;height:78px;padding-right:70px;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 18px,var(--line-2) 18px,var(--line-2) 19px)}
.runway-days{display:flex;align-items:flex-end;height:100%;gap:2px}
.rday{flex:1;height:100%;position:relative;min-width:4px}
.rday>i{position:absolute;left:0;right:0;bottom:0;display:block;border-radius:2px 2px 0 0;height:calc(var(--h,0)*100%);background:var(--c,var(--teal));transition:height .3s ease}
.rday.past>i{opacity:.28}
.rday.wkstart{border-left:1px dashed var(--line);margin-left:2px}
.rday.today:after{content:"";position:absolute;left:50%;transform:translateX(-50%);top:-7px;border-left:4px solid transparent;border-right:4px solid transparent;border-top:6px solid var(--ink)}
.rday.today>i{box-shadow:0 0 0 1.5px var(--ink)}
.runway-axis{display:flex;justify-content:space-between;margin-top:8px;padding-right:70px;font-size:11px;color:var(--ink-3)}
.stamp{position:absolute;right:6px;top:8px;width:62px;height:62px;border-radius:50%;border:2px solid var(--stamp);color:var(--stamp);opacity:.62;
  display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg)}
.stamp:before{content:"";position:absolute;inset:3px;border:1px solid var(--stamp);border-radius:50%;opacity:.55}
.stamp .d{font-family:'Bai Jamjuree',sans-serif;font-weight:700;font-size:20px;line-height:1}
.stamp .m{font-size:11px;line-height:1.2;font-weight:600}
.stamp .l{font-size:8px;letter-spacing:.08em;margin-top:1px}
.stamp.live{opacity:1}

/* weeks */
.wk{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.wk+.wk{margin-top:8px}
.wk .tag{width:30px;height:30px;flex:none;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-family:'Bai Jamjuree',sans-serif;font-weight:700;font-size:14px;color:#fff}
.wk .mid{flex:1;min-width:0}
.wk .mid .t{font-size:14.5px;font-weight:600}
.wk .mid .d{font-size:11.5px;color:var(--ink-3);font-family:'IBM Plex Mono',monospace}
.wk .amt{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;flex:none}
.wk.cur{border-color:var(--ink);box-shadow:0 1px 0 var(--ink)}
.wk.done{opacity:.5}

/* split */
.split{display:flex;gap:8px;margin-top:12px}
.split>div{flex:1;background:var(--card-2);border:1px solid var(--line-2);border-radius:11px;padding:11px 6px;text-align:center}
.split b{display:block;font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600}
.split small{font-size:10.5px;color:var(--ink-3);display:block;margin-top:2px}

/* details */
details{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-top:10px;overflow:hidden}
details+details{margin-top:8px}
summary{padding:14px 16px;font-size:14.5px;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary:after{content:"";width:7px;height:7px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);margin-top:-3px}
details[open] summary:after{transform:rotate(-135deg);margin-top:2px}
.dbody{padding:0 16px 14px}

.pd{display:flex;align-items:center;gap:12px;padding:9px 10px;border-bottom:1px solid var(--line-2)}
.pd:last-child{border-bottom:none}
.pd .n{width:20px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-3)}
.pd .m{flex:1;font-size:14px}
.pd .dt{font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:500}
.pd.past{opacity:.38}
.pd.next{background:var(--card-2);border-radius:9px;font-weight:600}
.pd.next .dt{color:var(--stamp)}

.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 10px}
.switch b{font-weight:600;font-size:14.5px;display:block}
.switch small{font-size:11.5px;color:var(--ink-3)}
.tog{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .2s}
.tog:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.tog.on{background:var(--teal)}
.tog.on:after{transform:translateX(20px)}
.pcts{display:flex;gap:8px}
.pcts>label{flex:1}
.pcts input{text-align:center;padding:10px 4px}

.hint{font-size:12px;color:var(--ink-3);margin-top:8px;line-height:1.5}
.notice{background:var(--stamp);color:#fff;border-radius:var(--r);padding:13px 16px;margin-bottom:14px}
.notice b{display:block;font-size:14.5px;margin-bottom:2px;font-family:'Bai Jamjuree',sans-serif}
.notice p{margin:0;font-size:13px;opacity:.9;line-height:1.45}
.btn{display:block;width:100%;padding:12px;border-radius:11px;background:#fff;color:var(--stamp);font-weight:600;margin-top:11px;font-family:'Bai Jamjuree',sans-serif}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="masthead">
    <h1>รางเงิน</h1>
    <div class="eyebrow" id="cycLabel">—</div>
  </header>

  <div id="alert"></div>

  <div class="card">
    <label class="f"><span>เงินที่ต้องแบ่ง</span>
      <input type="number" inputmode="decimal" id="amt" placeholder="0" step="1">
    </label>
    <div class="two" style="margin-top:12px">
      <label class="f"><span>กันสำรองฉุกเฉิน</span>
        <input type="number" inputmode="decimal" id="res" placeholder="0" step="1">
      </label>
      <label class="f"><span>เริ่มนับจาก</span>
        <input type="date" id="start">
      </label>
    </div>
    <div class="hint" id="setupHint"></div>
  </div>

  <div class="hero" id="hero"></div>
  <div id="runwayBox"></div>

  <div class="sec">
    <div class="sec-h"><div class="eyebrow">ซองรายสัปดาห์</div><div class="eyebrow" id="wkTotal"></div></div>
    <div id="weeks"></div>
  </div>

  <div class="sec">
    <div class="sec-h"><div class="eyebrow">แบ่งรายได้พิเศษ</div><div class="eyebrow" id="splitRatio"></div></div>
    <div class="card">
      <label class="f"><span>ได้มาเท่าไหร่</span>
        <input type="number" inputmode="decimal" id="inc" placeholder="0" step="1">
      </label>
      <div class="split" id="incSplit"></div>
    </div>
  </div>

  <div class="sec">
    <details id="dPay">
      <summary>ตารางจ่ายเงินเดือน 2569</summary>
      <div class="dbody" id="pdBody"></div>
    </details>
    <details>
      <summary>ตั้งค่า</summary>
      <div class="dbody">
        <div class="switch">
          <div><b>ถ่วงน้ำหนักวันศุกร์–อาทิตย์</b><small>ให้งบวันหยุดมากกว่าวันธรรมดา 1.5 เท่า</small></div>
          <div class="tog" id="togW"></div>
        </div>
        <div class="eyebrow" style="margin:6px 0 8px">สัดส่วนรายได้พิเศษ (%)</div>
        <div class="pcts">
          <label class="f"><span>เงินเก็บ</span><input type="number" inputmode="numeric" id="pS"></label>
          <label class="f"><span>กันชน</span><input type="number" inputmode="numeric" id="pB"></label>
          <label class="f"><span>ใช้ส่วนตัว</span><input type="number" inputmode="numeric" id="pF"></label>
        </div>
        <div class="hint">ค่าที่กรอกทั้งหมดถูกจำไว้ในเครื่อง เปิดใหม่ครั้งหน้าจะยังอยู่</div>
      </div>
    </details>
  </div>
</div>

<script>
(function(){
"use strict";

var PAYDAYS=[
  ["2026-07-29","กรกฎาคม 2569"],["2026-08-26","สิงหาคม 2569"],["2026-09-28","กันยายน 2569"],
  ["2026-10-28","ตุลาคม 2569"],["2026-11-26","พฤศจิกายน 2569"],["2026-12-28","ธันวาคม 2569"],
  ["2027-01-27","มกราคม 2570"],["2027-02-24","กุมภาพันธ์ 2570"],["2027-03-29","มีนาคม 2570"],
  ["2027-04-28","เมษายน 2570"]
];
var WKC=["var(--w1)","var(--w2)","var(--w3)","var(--w4)","var(--w5)"];
var TH_MON=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
var TH_DOW=["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"];

function p2(n){return (n<10?"0":"")+n;}
function d2iso(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());}
function iso2d(s){var a=s.split("-");return new Date(+a[0],+a[1]-1,+a[2]);}
function today(){return d2iso(new Date());}
function addDays(iso,n){var d=iso2d(iso);d.setDate(d.getDate()+n);return d2iso(d);}
function diffDays(a,b){return Math.round((iso2d(b)-iso2d(a))/86400000);}
function rangeDays(a,b){var o=[],c=a,g=0;while(diffDays(c,b)>=0&&g++<400){o.push(c);c=addDays(c,1);}return o;}
function thDate(iso,y){var d=iso2d(iso);return d.getDate()+" "+TH_MON[d.getMonth()]+(y?" "+String(d.getFullYear()+543).slice(-2):"");}
function thDow(iso){return TH_DOW[iso2d(iso).getDay()];}
function fmt(n){return Math.round(n).toLocaleString("en-US");}
var el=function(id){return document.getElementById(id);};

/* ---- state ---- */
var KEY="nine-runway-v2";
var S={amount:0,reserve:0,start:today(),weekend:true,split:{s:50,b:30,f:20},inc:0};
try{var raw=localStorage.getItem(KEY); if(raw){var o=JSON.parse(raw); for(var k in o) if(o[k]!==undefined) S[k]=o[k];}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---- math ---- */
function nextPayday(from){for(var i=0;i<PAYDAYS.length;i++){if(diffDays(from,PAYDAYS[i][0])>0)return PAYDAYS[i];}return null;}
function paydayName(iso){for(var i=0;i<PAYDAYS.length;i++){if(PAYDAYS[i][0]===iso)return PAYDAYS[i][1];}return "";}
function wOf(iso){if(!S.weekend)return 1;var g=iso2d(iso).getDay();return (g===5||g===6||g===0)?1.5:1;}
function cycle(){
  var st=S.start||today();
  var np=nextPayday(st);
  if(!np) return null;
  var end=addDays(np[0],-1);
  if(diffDays(st,end)<0) return null;
  return {start:st,end:end,payday:np[0],days:rangeDays(st,end)};
}
function spendable(){return Math.max(0,(+S.amount||0)-(+S.reserve||0));}
function weeks(){
  var c=cycle(); if(!c) return [];
  var sp=spendable(),chunks=[],i;
  for(i=0;i<c.days.length;i+=7) chunks.push(c.days.slice(i,i+7));
  var used=0,out=[];
  chunks.forEach(function(cd,idx){
    var alloc=(idx===chunks.length-1)?(sp-used):Math.floor(sp*cd.length/c.days.length);
    used+=alloc;
    var sw=cd.reduce(function(s,d){return s+wOf(d);},0);
    out.push({i:idx,days:cd,start:cd[0],end:cd[cd.length-1],alloc:alloc,sw:sw});
  });
  return out;
}
function dayAllow(iso){
  var ws=weeks();
  for(var i=0;i<ws.length;i++){
    if(iso>=ws[i].start&&iso<=ws[i].end) return ws[i].sw>0?ws[i].alloc*wOf(iso)/ws[i].sw:0;
  }
  return 0;
}

/* ---- render ---- */
function render(){
  var c=cycle();
  el("cycLabel").textContent = c ? ("งวด "+paydayName(c.payday)) : "—";

  /* alert when the cycle has run out */
  var al="";
  if(c && today()>c.end){
    al='<div class="notice"><b>งวดนี้หมดแล้ว</b><p>เงินเดือนงวดถัดไปเข้า '+thDate(c.payday,true)+' กดปุ่มเพื่อเริ่มนับงวดใหม่จากวันนี้</p><button class="btn" id="btnNew">เริ่มงวดใหม่</button></div>';
  }
  el("alert").innerHTML=al;
  if(el("btnNew")) el("btnNew").addEventListener("click",function(){
    S.start=today(); S.amount=0; save(); syncInputs(); render();
  });

  if(!c){
    el("setupHint").textContent="ไม่มีวันจ่ายเงินเดือนถัดไปในตาราง";
    el("hero").className="hero off";
    el("hero").innerHTML='<div class="eyebrow">งบวันนี้</div><div class="big"><b>—</b></div>';
    el("runwayBox").innerHTML=""; el("weeks").innerHTML=""; el("wkTotal").textContent="";
    renderPaydays(); renderSplit(); return;
  }

  var n=c.days.length, sp=spendable();
  el("setupHint").textContent = n+" วัน ถึง "+thDate(c.end,true)+" · เงินเดือนเข้า "+thDow(c.payday)+"ที่ "+thDate(c.payday,true);

  /* hero: today's allowance */
  var t=today(), inCycle=(t>=c.start&&t<=c.end);
  var allow=inCycle?dayAllow(t):0;
  var left=diffDays(t,c.payday);
  el("hero").className="hero"+(sp>0&&inCycle?"":" off");
  var wd=0,we=0;
  if(sp>0){ var w0=weeks()[0]; if(w0&&w0.sw>0){ wd=w0.alloc/w0.sw; we=wd*1.5; } }
  el("hero").innerHTML=
    '<div class="eyebrow">'+(inCycle?("งบวัน"+thDow(t)+"ที่ "+thDate(t)):"งบต่อวัน")+'</div>'
    +'<div class="big"><b>'+(sp>0?fmt(inCycle?allow:sp/n):"—")+'</b><span>บาท</span></div>'
    +'<div class="sub">'+(sp>0
        ? (S.weekend
            ? "จันทร์–พฤหัส วันละ "+fmt(wd)+" · ศุกร์–อาทิตย์ วันละ "+fmt(we)
            : "เฉลี่ยวันละ "+fmt(sp/n))
          +(left>0?" · อีก "+left+" วันเงินเดือนออก":" · วันนี้เงินเดือนเข้า")
        : "ใส่ยอดเงินด้านบนเพื่อแบ่งเป็นซองรายสัปดาห์")
    +'</div>';

  /* runway */
  var ws=weeks();
  var maxA=0; c.days.forEach(function(d){maxA=Math.max(maxA,dayAllow(d));});
  var cells=c.days.map(function(d){
    var h=maxA>0?dayAllow(d)/maxA:0.25;
    var cls="rday"+(d<t?" past":"")+(d===t?" today":"");
    var color="var(--line)";
    for(var k=0;k<ws.length;k++){
      if(d>=ws[k].start&&d<=ws[k].end) color=WKC[k%WKC.length];
      if(k>0&&ws[k].start===d) cls+=" wkstart";
    }
    if(maxA<=0){h=0.08;color="var(--line)";}
    return '<div class="'+cls+'" style="--h:'+h.toFixed(3)+';--c:'+color+'"></div>';
  }).join("");
  var pd=iso2d(c.payday);
  el("runwayBox").innerHTML=
    '<div class="runway-wrap">'
    +'<div class="runway-head"><div class="eyebrow">รางถึงวันเงินเดือน</div><div class="eyebrow">'+(left>0?"อีก "+left+" วัน":"วันนี้เงินเข้า")+'</div></div>'
    +'<div class="runway"><div class="runway-days">'+cells+'</div>'
    +'<div class="stamp'+(left<=0?" live":"")+'"><span class="d">'+pd.getDate()+'</span><span class="m">'+TH_MON[pd.getMonth()]+'</span><span class="l">เงินเดือน</span></div></div>'
    +'<div class="runway-axis"><span>'+thDate(c.start)+'</span><span>'+(S.weekend?"แท่งสูง = วันศุกร์–อาทิตย์":"แบ่งเท่ากันทุกวัน")+'</span></div>'
    +'</div>';

  /* weeks */
  el("wkTotal").textContent = sp>0 ? "รวม "+fmt(sp)+" บาท" : "";
  el("weeks").innerHTML = ws.map(function(w){
    var isCur=(t>=w.start&&t<=w.end), isPast=(t>w.end);
    var per = w.sw>0 ? w.alloc/w.sw : 0;
    var detail = S.weekend
      ? fmt(per)+" / "+fmt(per*1.5)+" ต่อวัน"
      : fmt(w.alloc/w.days.length)+" ต่อวัน";
    return '<div class="wk'+(isCur?" cur":"")+(isPast?" done":"")+'">'
      +'<div class="tag" style="background:'+WKC[w.i%WKC.length]+'">'+(w.i+1)+'</div>'
      +'<div class="mid"><div class="t">'+thDate(w.start)+' – '+thDate(w.end)+'</div>'
      +'<div class="d">'+w.days.length+' วัน · '+detail+'</div></div>'
      +'<div class="amt">'+fmt(w.alloc)+'</div></div>';
  }).join("");

  renderPaydays();
  renderSplit();
}

function renderPaydays(){
  var t=today(), nx=(nextPayday(t)||[])[0];
  el("pdBody").innerHTML=PAYDAYS.map(function(p,i){
    var cls=p[0]===nx?"next":(diffDays(t,p[0])<0?"past":"");
    var ex=p[0]===nx?" · อีก "+diffDays(t,p[0])+" วัน":"";
    return '<div class="pd '+cls+'"><div class="n">'+(i+1)+'</div><div class="m">'+p[1]+ex+'</div><div class="dt">'+thDate(p[0],true)+'</div></div>';
  }).join("");
}

function renderSplit(){
  var s=S.split, tot=(+s.s||0)+(+s.b||0)+(+s.f||0);
  el("splitRatio").textContent = s.s+" / "+s.b+" / "+s.f;
  var v=+S.inc||0;
  var a=tot>0?Math.round(v*s.s/tot):0, b=tot>0?Math.round(v*s.b/tot):0;
  var f=Math.round(v)-a-b;
  if(tot<=0){a=b=f=0;}
  el("incSplit").innerHTML=
     '<div><b>'+fmt(a)+'</b><small>เงินเก็บ</small></div>'
    +'<div><b>'+fmt(b)+'</b><small>กันชน</small></div>'
    +'<div><b>'+fmt(f<0?0:f)+'</b><small>ใช้ส่วนตัว</small></div>';
}

/* ---- inputs ---- */
function syncInputs(){
  el("amt").value = S.amount? S.amount : "";
  el("res").value = S.reserve? S.reserve : "";
  el("start").value = S.start||today();
  el("inc").value = S.inc? S.inc : "";
  el("togW").classList.toggle("on",!!S.weekend);
  el("pS").value=S.split.s; el("pB").value=S.split.b; el("pF").value=S.split.f;
}
function bind(id,fn){el(id).addEventListener("input",function(){fn(el(id).value);save();render();});}
bind("amt",function(v){S.amount=parseFloat(v)||0;});
bind("res",function(v){S.reserve=parseFloat(v)||0;});
bind("start",function(v){S.start=v||today();});
el("inc").addEventListener("input",function(){S.inc=parseFloat(el("inc").value)||0;save();renderSplit();});
el("togW").addEventListener("click",function(){S.weekend=!S.weekend;save();syncInputs();render();});
["pS","pB","pF"].forEach(function(id){
  el(id).addEventListener("input",function(){
    S.split={s:parseInt(el("pS").value,10)||0,b:parseInt(el("pB").value,10)||0,f:parseInt(el("pF").value,10)||0};
    save();renderSplit();
  });
});

/* icon */
(function(){try{
  var c=document.createElement("canvas");c.width=c.height=180;var x=c.getContext("2d");
  x.fillStyle="#E7EBE4";x.fillRect(0,0,180,180);
  x.strokeStyle="#A6322B";x.lineWidth=6;x.beginPath();x.arc(90,90,58,0,Math.PI*2);x.stroke();
  x.lineWidth=2.5;x.beginPath();x.arc(90,90,49,0,Math.PI*2);x.stroke();
  x.fillStyle="#16241F";x.font="700 62px sans-serif";x.textAlign="center";x.textBaseline="middle";
  x.fillText("฿",90,94);
  var l=document.createElement("link");l.rel="apple-touch-icon";l.href=c.toDataURL("image/png");
  document.head.appendChild(l);
}catch(e){}})();

syncInputs();
render();
})();
</script>
